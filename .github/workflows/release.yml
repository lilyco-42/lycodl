# ── lycodl 多平台打包 / 发布流水线 ──
#
# 触发：
#   - push 到 v* 标签            → 构建全部平台并发布 GitHub Release
#   - workflow_dispatch          → 手动触发（非标签时只上传构件，不建 Release）
#
# 产出构件（每个平台一个压缩包，内含 lycodl 二进制 + extension/ 浏览器扩展 + README）：
#   - Linux   x86_64            （glibc）
#   - Linux   aarch64           （cross 交叉编译）
#   - Windows x86_64 (.exe)     （MSVC 原生）
#   - macOS   universal         （x86_64 + arm64 lipo 合并）
#   - Android aarch64 (CLI)      （Termux 可用；非 App，见下方说明）
#
# 关于 iOS / 鸿蒙(HarmonyOS)：本仓库产物是「本地起 Web 控制台的 CLI 二进制」，这两个平台
# 没有命令行运行环境，且各自的 App 上架需要 Apple / DevEco 签名与原生(Tauri)外壳，
# GitHub 托管 Runner 无法提供。自动化可安装包不在本 CI 范围——若要支持，应另起 Tauri 工程
# （tauri-plugin-cli 把本二进制当后端），分别走 Xcode Cloud / DevEco 流水线。本流程已为
# Linux/Windows/macOS/Android(CLI) 给出可复用的构建步骤。

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install, lint & build web console
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build
      - name: Upload web/dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  linux-x64:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x64-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Package
        run: |
          BIN=target/x86_64-unknown-linux-gnu/release/lycodl
          strip "$BIN" || true
          mkdir -p dist/lycodl-linux-x64
          cp "$BIN" dist/lycodl-linux-x64/
          cp -r extension dist/lycodl-linux-x64/
          cp README.md dist/lycodl-linux-x64/
          tar -C dist -czf lycodl-linux-x64.tar.gz lycodl-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: lycodl-linux-x64
          path: lycodl-linux-x64.tar.gz

  linux-aarch64:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: houseabsolute/actions-rust-cross@v0
        with:
          target: aarch64-unknown-linux-gnu
          args: --release
      - name: Package
        run: |
          BIN=target/aarch64-unknown-linux-gnu/release/lycodl
          aarch64-linux-gnu-strip "$BIN" 2>/dev/null || true
          mkdir -p dist/lycodl-linux-aarch64
          cp "$BIN" dist/lycodl-linux-aarch64/
          cp -r extension dist/lycodl-linux-aarch64/
          cp README.md dist/lycodl-linux-aarch64/
          tar -C dist -czf lycodl-linux-aarch64.tar.gz lycodl-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: lycodl-linux-aarch64
          path: lycodl-linux-aarch64.tar.gz

  windows-x64:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x64-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/lycodl-windows-x64
          Copy-Item target/x86_64-pc-windows-msvc/release/lycodl.exe dist/lycodl-windows-x64/
          Copy-Item -Recurse extension dist/lycodl-windows-x64/
          Copy-Item README.md dist/lycodl-windows-x64/
          Compress-Archive -Path dist/lycodl-windows-x64/* -DestinationPath lycodl-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lycodl-windows-x64
          path: lycodl-windows-x64.zip

  macos:
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ hashFiles('**/Cargo.lock') }}
      - name: Build both arches
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create -output target/release/lycodl \
            target/x86_64-apple-darwin/release/lycodl \
            target/aarch64-apple-darwin/release/lycodl
          strip target/release/lycodl
      - name: Package
        run: |
          mkdir -p dist/lycodl-macos-universal
          cp target/release/lycodl dist/lycodl-macos-universal/
          cp -r extension dist/lycodl-macos-universal/
          cp README.md dist/lycodl-macos-universal/
          tar -C dist -czf lycodl-macos-universal.tar.gz lycodl-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: lycodl-macos-universal
          path: lycodl-macos-universal.tar.gz

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: Build (cargo ndk)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t aarch64-linux-android build --release
      - name: Package
        run: |
          BIN=target/aarch64-linux-android/release/lycodl
          mkdir -p dist2/lycodl-android-aarch64
          cp "$BIN" dist2/lycodl-android-aarch64/
          cp -r extension dist2/lycodl-android-aarch64/
          cp README.md dist2/lycodl-android-aarch64/
          tar -C dist2 -czf lycodl-android-aarch64.tar.gz lycodl-android-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: lycodl-android-aarch64
          path: lycodl-android-aarch64.tar.gz

  test:
    runs-on: ubuntu-latest
    needs: [linux-x64, web]
    steps:
      - uses: actions/checkout@v4
      # assets.rs 用 include_dir! 内嵌 web/dist，编译期必须有该目录（git 忽略，仅由 web job 产出）
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ hashFiles('**/Cargo.lock') }}

      - name: Unit & integration tests (cargo test)
        run: cargo test --all-targets --locked

      - name: Clippy (report only, non-blocking)
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      # 直接拿「发布构件」做端到端烟测：跑 --version / --help / 起服务探 /api/health
      - uses: actions/download-artifact@v4
        with:
          name: lycodl-linux-x64
          path: smoke
      - name: Binary smoke test (real release artifact)
        run: |
          tar -xzf smoke/lycodl-linux-x64.tar.gz -C smoke
          BIN="$(pwd)/smoke/lycodl-linux-x64/lycodl"
          # 隔离数据目录：否则 remembered_port() 可能命中本机已运行实例而跳过绑定
          mkdir -p smoke/data
          export LYCODL_DATA_DIR="$(pwd)/smoke/data"
          test -x "$BIN" || { echo "binary missing"; exit 1; }
          "$BIN" --version
          "$BIN" --help | head -20
          LYCODL_PORT=18799 "$BIN" --web >smoke.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18799/api/health >health.json 2>/dev/null; then ok=1; break; fi
            sleep 0.5
          done
          # 子进程是被 SIGTERM 杀掉的，wait 返回 143；bash -e 下必须吞掉，否则脚本在断言前就以 143 退出
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          test "$ok" -eq 1 || { echo "server did not come up"; cat smoke.log; exit 1; }
          echo "--- /api/health ---"; cat health.json
          echo
          jq -e '.name=="lycodl" and (.webMode=="embedded")' health.json \
            || { echo "health payload unexpected"; exit 1; }

  release:
    needs: [linux-x64, linux-aarch64, windows-x64, macos, android, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lycodl-*
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
