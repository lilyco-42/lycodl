[package]
name = "lycodl"
version = "0.1.0"
edition = "2021"
publish = false
description = "lycodl — yt-dlp 内核 + lilyco 命令面 + shadcn Web 控制台的多平台视频下载器"

[dependencies]
lilyco = { path = "/home/lilyco/code/lilyco/lilyco", features = ["tui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
include_dir = "0.7"
mime_guess = "2"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
directories = "6"
libc = "0.2"

[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256
debug = 0
