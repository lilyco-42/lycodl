name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web console
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build

      - name: Format
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Release build
        run: cargo build --release

      - name: Publish adapters
        run: |
          node publish-driver/validate-adapters.mjs
          node --test publish-driver/adapter.test.mjs
          node extension/validate-extension.mjs

      - name: Runtime smoke
        run: node scripts/smoke.mjs

  extension-smoke:
    name: extension executor smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Adapter contract
        run: |
          node publish-driver/validate-adapters.mjs
          node --test publish-driver/adapter.test.mjs
          node extension/validate-extension.mjs
      - name: Executor smoke (headless Chrome + chrome.debugger)
        run: node scripts/extension-smoke.mjs
